baseURL = "https://rifkiaz.my.id/"
title = "Rifki Affandi"
theme = "PaperMod"

# Indonesian stays at the root (existing URLs unchanged); English lives under /en/.
# Translations pair up by file name: index.md + index.en.md, tentang.md + tentang.en.md.
defaultContentLanguage = "id"
defaultContentLanguageInSubdir = false

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# GA4. Rendered by layouts/_partials/google_analytics.html, which only
# loads it on the live domain (not Netlify previews or hugo server).
[services.googleAnalytics]
  id = "G-3VVK0R7V10"

[services.disqus]
  shortname = "blog-rifkiaz-web-id"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  # No per-tag/per-category feeds: Search Console flagged them as duplicates.
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  env = "production"
  homeTitle = "Rifki Affandi · DevOps Engineer, Blog & Portofolio"
  description = "Blog dan portofolio Rifki Affandi, DevOps engineer dan openSUSE Member. Catatan teknis seputar Ansible, Terraform, monitoring Prometheus, Linux, dan open source."
  author = "Rifki Affandi"
  keywords = ["DevOps", "Ansible", "MongoDB", "Prometheus", "Linux", "openSUSE", "FLOSS"]
  images = ["img/rifki-gnome-asia.jpg"]

  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  comments = true
  mainSections = ["posts"]
  # Author links (post meta, author box); per language.
  aboutURL = "tentang/"
  # Tag pages with fewer posts than this get noindex and stay out of the sitemap.
  minTagPagesToIndex = 3
  # Shown under each post; also links posts to each other (internal linking).
  ShowRelated = true
  DateFormat = "2 January 2006"
  displayFullLangName = true

  [params.schema]
    siteName = "Rifki Affandi"
    alternateName = ["rifkiaz", "rifkiaz.my.id"]
    jobTitle = "DevOps Engineer"
    givenName = "Rifki"
    familyName = "Affandi"
    personAlternateName = ["rifkiaz"]
    email = "rifkiaz@opensuse.org"
    personDescription = "DevOps engineer yang mengurus infrastruktur, otomasi Ansible dan Terraform, serta monitoring. openSUSE Member dan aktif di komunitas open source."
    personImage = "img/rifki-gnome-asia.jpg"
    knowsAbout = ["DevOps", "Ansible", "Terraform", "Prometheus", "Linux", "openSUSE", "MongoDB"]
    sameAs = [
      "https://github.com/rifkiaz",
      "https://x.com/rifkiiaz",
      "https://instagram.com/rifkiaz",
      "https://kudos.opensuse.org/user/Rifkiaz",
    ]

  [params.label]
    text = "rifkiaz"
    icon = "logo.svg"
    iconHeight = 30

  [params.homeInfoParams]
    Title = "Rifki Affandi"
    Prompt = "rifki@devops: ~"
    Typed = ["DevOps Engineer", "Infra & Automation", "Terraform & IaC", "Ansible Enthusiast", "openSUSE Member"]
    Stack = ["linux", "ansible", "terraform", "docker", "aws", "gcp", "prometheus", "grafana", "mongodb", "vault", "n8n"]
    Content = """
Sehari-hari saya mengurus infrastruktur dan DevOps: otomasi server pakai Ansible, database, monitoring, sampai tooling internal. Di sini saya mencatat hal-hal teknis dari kerjaan dan dari ngoprek bareng komunitas open source.

Saya juga [member openSUSE](https://kudos.opensuse.org/user/Rifkiaz) dan aktif di komunitasnya.
"""
    Buttons = [
      { name = "proyek", url = "/proyek/" },
      { name = "cheatsheet", url = "/cheatsheet/" },
      { name = "tentang", url = "/tentang/" },
      { name = "lab", url = "/lab/" },
      { name = "terminal", url = "/terminal/" },
    ]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rifkiaz"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/rifkiiaz"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/rifkiaz"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:rifkiaz@opensuse.org"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.analytics.google]
    SiteVerificationTag = "U56nvClo7tvzuy2DqvaTewMXui3fJ8HZr73GR_POzKg"

  [params.editPost]
    URL = "https://github.com/rifkiaz/rifkiaz.github.io/blob/source/content"
    Text = "Sarankan perubahan"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    keys = ["title", "permalink", "summary", "content"]

[languages.id]
  languageName = "Bahasa Indonesia"
  languageCode = "id-ID"
  weight = 1

