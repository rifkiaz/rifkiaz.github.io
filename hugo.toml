[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 20
  [[related.indices]]
    name = "series"
    weight = 90

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

# English. Pages and posts with an .en.md file get an English version under /en/.
# Labs without an English page yet are listed on /en/lab/ and in the Lab
# dropdown with a link to the Indonesian page (layouts/_partials/lab-items.html).
[languages.en]
  languageName = "English"
  languageCode = "en-US"
  weight = 2

  [languages.en.params]
    homeTitle = "Rifki Affandi · DevOps Engineer, Blog & Portfolio"
    description = "Blog and portfolio of Rifki Affandi, DevOps engineer and openSUSE Member. Hands-on notes on Ansible, Terraform, Prometheus monitoring, Linux, and open source."
    DateFormat = "January 2, 2006"
    aboutURL = "about/"

    [languages.en.params.schema]
      personDescription = "DevOps engineer working on infrastructure, Ansible and Terraform automation, and monitoring. openSUSE Member, active in the open source community."

    [languages.en.params.homeInfoParams]
      Content = """
Day to day I work on infrastructure and DevOps: automating servers with Ansible, running databases, setting up monitoring, and building internal tooling. This is where I keep technical notes from work and from tinkering with the open source community.

I'm also an [openSUSE Member](https://kudos.opensuse.org/user/Rifkiaz) and active in its community.
"""
      Buttons = [
        { name = "projects", url = "/projects/" },
        { name = "about", url = "/about/" },
        { name = "lab", url = "/lab/" },
        { name = "terminal", url = "/terminal/" },
      ]

    [languages.en.params.editPost]
      Text = "Suggest a change"

