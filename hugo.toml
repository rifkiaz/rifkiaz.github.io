baseURL = "https://rifkiaz.my.id/"
title = "Rifki Affandi"
theme = "PaperMod"

defaultContentLanguage = "id"
languageCode = "id"

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[services.disqus]
  shortname = "blog-rifkiaz-web-id"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Catatan teknis seputar DevOps, otomasi infrastruktur, observability, dan FLOSS oleh Rifki Affandi."
  author = "Rifki Affandi"
  keywords = ["DevOps", "Ansible", "MongoDB", "Prometheus", "Linux", "openSUSE", "FLOSS"]
  images = ["img/rifki-gnome-asia.jpg"]

  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  comments = true
  mainSections = ["posts"]
  DateFormat = "2 January 2006"

  [params.homeInfoParams]
    Title = "Halo, saya Rifki Affandi 👋"
    Typed = ["DevOps Engineer", "Infra & Automation", "Ansible Enthusiast", "openSUSE Member"]
    Content = """
Sehari-hari saya mengurus infrastruktur dan DevOps: otomasi server pakai Ansible, database, monitoring, sampai tooling internal. Di sini saya mencatat hal-hal teknis dari kerjaan dan dari ngoprek bareng komunitas open source.

Saya juga [member openSUSE](https://kudos.opensuse.org/user/Rifkiaz) dan aktif di komunitasnya.

[Lihat proyek](/proyek/) · [Cheat sheet](/cheatsheet/) · [Tentang saya](/tentang/)
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rifkiaz"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/rifkiiaz"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/rifkiaz"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.analytics.google]
    SiteVerificationTag = "U56nvClo7tvzuy2DqvaTewMXui3fJ8HZr73GR_POzKg"

  [params.editPost]
    URL = "https://github.com/rifkiaz/rifkiaz.github.io/blob/source/content"
    Text = "Sarankan perubahan"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Tulisan"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "proyek"
    name = "Proyek"
    url = "/proyek/"
    weight = 20

  [[menu.main]]
    identifier = "cheatsheet"
    name = "Cheat Sheet"
    url = "/cheatsheet/"
    weight = 25

  [[menu.main]]
    identifier = "archives"
    name = "Arsip"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    identifier = "tags"
    name = "Tag"
    url = "/tags/"
    weight = 40

  [[menu.main]]
    identifier = "search"
    name = "Cari"
    url = "/search/"
    weight = 50

  [[menu.main]]
    identifier = "tentang"
    name = "Tentang"
    url = "/tentang/"
    weight = 60

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
