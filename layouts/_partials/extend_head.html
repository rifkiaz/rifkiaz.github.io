<style>
  /* JetBrains Mono (SIL OFL 1.1), latin subset, variable weight */
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    font-display: swap;
    src: url("{{ "fonts/jetbrains-mono-latin.woff2" | absURL }}") format("woff2");
  }
  /* ---------- palette ---------- */
  :root {
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --accent: #15803d;
    --accent-2: #1d4ed8;
    --accent-soft: rgba(21, 128, 61, 0.12);
    --code-bg: #f1f3f5;
    --border: #e4e7eb;
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --theme: #0d1117;
    --entry: #161b22;
    --primary: #e6edf3;
    --secondary: #8b949e;
    --tertiary: #30363d;
    --content: #c9d1d9;
    --code-block-bg: #161b22;
    --code-bg: #1f2630;
    --border: #30363d;
    --accent: #3fb950;
    --accent-2: #58a6ff;
    --accent-soft: rgba(63, 185, 80, 0.15);
  }
  ::selection { background: var(--accent-soft); }

  /* ---------- header ---------- */
  .logo a { font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; column-gap: 0; }
  .logo a img { width: 30px; height: 30px; margin-inline-end: 10px; border-radius: 7px; }
  #menu a { font-family: var(--mono); font-size: 15px; text-transform: lowercase; }
  #menu a::before { content: "/"; color: var(--accent); }
  #menu .active { text-decoration-color: var(--accent); }
  /* nested menu: toggle button + dropdown panel (placed by js/submenu.js) */
  .header { position: relative; }
  #menu .sub-toggle {
    display: flex; align-items: center; gap: 0.35ch; padding: 0; border: 0; background: none;
    color: var(--primary); font: inherit; font-family: var(--mono); font-size: 15px; line-height: inherit;
    text-transform: lowercase; cursor: pointer;
  }
  #menu .sub-toggle::before { content: "/"; color: var(--accent); }
  #menu .sub-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sub-caret { color: var(--accent); font-size: 0.8em; transition: transform 0.15s; }
  .sub-toggle[aria-expanded="true"] .sub-caret { transform: rotate(180deg); }
  #menu .submenu {
    position: absolute; z-index: 30; min-width: 200px; margin: 0; padding: 6px; list-style: none;
    background: var(--entry); border: 1px solid var(--border); border-top: 2px solid var(--accent);
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); line-height: 1.4;
  }
  #menu .submenu[hidden] { display: none; }
  #menu .submenu a { display: block; padding: 8px 10px; border-radius: 6px; font-size: 14px; white-space: nowrap; }
  #menu .submenu a:hover, #menu .submenu a:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
  #menu .submenu a[aria-current="page"] { color: var(--accent); }
  .breadcrumbs, .post-meta, .entry-footer, .footer, .paginav .title, .post-tags, .toc summary {
    font-family: var(--mono);
  }
  .post-meta, .entry-footer { font-size: 13px; }
  .footer { font-size: 12px; }
  .footer a:hover, .post-content a:hover { color: var(--accent); }

  /* ---------- list pages ---------- */
  .page-header h1::before { content: "~/"; color: var(--accent); font-family: var(--mono); font-size: 0.75em; font-weight: 500; margin-inline-end: 0.3ch; }
  .post-entry { border: 1px solid var(--border); transition: border-color 0.15s ease; }
  .post-entry:hover { border-color: var(--accent); }
  .entry-header h2 { font-size: 22px; }

  /* ---------- post ---------- */
  .post-content h2::before, .post-content h3::before {
    color: var(--accent); font-family: var(--mono); font-weight: 500; margin-inline-end: 0.5ch;
  }
  .post-content h2::before { content: "##"; }
  .post-content h3::before { content: "###"; }
  .post-content a { box-shadow: 0 1px 0 var(--accent); }
  .post-content pre, .post-content .highlight pre { border-radius: var(--radius); }
  .post-content .highlight, .post-content > pre { border: 1px solid var(--border); border-radius: var(--radius); }
  .post-content code { font-family: var(--mono); font-size: 0.86em; }
  .post-content blockquote { border-inline-start-color: var(--accent); }
  .post-tags a { font-size: 13px; text-transform: lowercase; }
  .post-tags a::before { content: "#"; color: var(--accent); }

  /* ---------- home terminal ---------- */
  .home-info { min-height: auto; margin-top: 8px; }
  .terminal {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--entry);
    overflow: hidden;
    box-shadow: 0 12px 32px -18px rgba(0, 0, 0, 0.35);
  }
  .terminal-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .terminal-bar .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .dot-red { background: #ff5f57; } .dot-yellow { background: #febc2e; } .dot-green { background: #28c840; }
  .terminal-title {
    flex: 1; text-align: center; margin-inline-end: 46px;
    font-family: var(--mono); font-size: 12px; color: var(--secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .terminal-body { padding: 18px 20px 20px; font-family: var(--mono); font-size: 14px; line-height: 1.6; }
  .terminal-body p, .terminal-body ul { margin: 0; }
  .term-line { color: var(--secondary); }
  .term-line + .term-out { margin-bottom: 12px; }
  .term-out:last-child { margin-bottom: 0; }
  .term-prompt { color: var(--accent); font-weight: 700; margin-inline-end: 0.6ch; }
  .first-entry .term-name {
    font-family: var(--mono); font-size: 30px; line-height: 1.3; font-weight: 700;
    color: var(--primary); letter-spacing: -0.02em;

  .home-typed { font-size: 17px; font-weight: 500; color: var(--accent); min-height: 1.6em; contain: layout paint; }
  .home-typed-cursor {
    display: inline-block; width: 0.6ch; height: 1.15em; margin-inline-start: 2px;
    vertical-align: text-bottom; background: var(--accent);
    animation: term-blink 1s steps(1) infinite;
  }
  .term-ls { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 2.2ch; color: var(--accent-2); font-weight: 500; }
  .home-info .entry-content { margin-top: 22px; }
  .home-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 6px; }
  .home-buttons a {
    font-family: var(--mono); font-size: 14px;
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--entry); color: var(--primary);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .home-buttons a span { color: var(--accent); }
  .home-buttons a:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- interactive terminal (/terminal/) ---------- */
  .term-hint { margin-top: 12px; }
  .term-hint a { color: var(--accent); box-shadow: none; }
  .term-hint a:hover { text-decoration: underline; }
  .term-app { margin-top: 4px; }
  .term-screen {
    height: min(62vh, 520px); overflow-y: auto; overscroll-behavior: contain;
    cursor: text; word-break: break-word;
  }
  .term-row { white-space: pre-wrap; min-height: 1.6em; color: var(--primary); }
  .term-echo { color: var(--content); margin-top: 6px; }
  .term-ps1 { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .term-hl { color: var(--accent); font-weight: 600; }
  .term-dim { color: var(--secondary); }
  .term-err { color: #d1242f; }
  :root[data-theme="dark"] .term-err { color: #f85149; }
  .term-ok { color: var(--accent); }
  .term-dir { color: var(--accent-2); font-weight: 600; }
  .term-exec { color: var(--accent); }
  .term-row a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
  .term-ls-out { display: flex; flex-wrap: wrap; gap: 2px 2.4ch; }
  .term-click { cursor: pointer; }
  .term-click:hover { text-decoration: underline; text-underline-offset: 3px; }
  .term-neofetch { display: flex; flex-wrap: wrap; gap: 4px 3ch; align-items: flex-start; }
  .term-art { color: #73ba25; white-space: pre; line-height: 1.25; font-weight: 600; }
  .term-art-small { display: none; }
  @media (max-width: 600px) {
    .term-art-big { display: none; }
    .term-art-small { display: inline; }
  }
  .term-input-line { display: flex; align-items: center; gap: 1ch; margin-top: 6px; }
  .term-input {
    flex: 1; min-width: 0; padding: 0; border: 0; outline: none; background: transparent;
    color: var(--primary); font: inherit; caret-color: var(--accent);
  }
  .term-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .term-chips button {
    font-family: var(--mono); font-size: 13px; cursor: pointer;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--entry); color: var(--primary);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .term-chips button:hover, .term-chips button:focus-visible { border-color: var(--accent); color: var(--accent); }
  .term-noscript { font-family: var(--mono); font-size: 14px; margin-top: 12px; }
  .term-shake { animation: term-shake 0.45s ease; }
  @keyframes term-shake {
    20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); }
  }

  @keyframes term-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .home-typed-cursor, .term-shake { animation: none; }
  }
  @media (max-width: 480px) {
    .first-entry .term-name { font-size: 24px; }

    .term-input { font-size: 16px; }
    .term-screen { height: 55vh; height: 55dvh; padding: 14px; }
    .term-chips button { padding: 8px 14px; font-size: 14px; }
  }

  /* ---------- Telegram invite card ---------- */
  .post-content .tg-invite { display: flex; gap: 20px; align-items: center; margin: 32px 0; padding: 18px; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius); background: var(--entry); }
  .post-content .tg-invite__qr { flex: 0 0 auto; display: block; padding: 6px; background: #fff; border-radius: 8px; box-shadow: none; line-height: 0; }
  .post-content .tg-invite__qr img { width: 140px; height: 140px; margin: 0; border-radius: 0; }
  .post-content .tg-invite__body p { margin: 0 0 10px; }
  .post-content .tg-invite__title { font-family: var(--mono); font-weight: 700; color: var(--primary); }
  .post-content .tg-invite__title::before { content: ""; display: inline-block; width: 18px; height: 12px; margin-inline-end: 8px; vertical-align: -1px; border: 1px solid var(--border); border-radius: 2px; background: linear-gradient(#e70011 50%, #fff 50%); }
  .post-content .tg-invite__btn { display: inline-block; padding: 6px 14px; border-radius: 6px; background: var(--accent); color: var(--theme); font-family: var(--mono); font-size: 14px; font-weight: 600; text-decoration: none !important; box-shadow: none; }
  .post-content .tg-invite__btn:hover { color: var(--theme); opacity: 0.9; }
  @media (max-width: 560px) {
    .post-content .tg-invite { flex-direction: column; text-align: center; }
  }
/* Series box */
.series-box { margin: 32px 0 8px; padding: 14px 18px; border: 1px solid var(--border); border-left: 3px solid #3fb950; border-radius: var(--radius); background: var(--entry); font-size: 15px; }
.series-box .series-title { margin: 0 0 6px; font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--secondary); }
.series-box ol { margin: 0; padding-inline-start: 22px; }
.series-box li { margin: 2px 0; }
.series-box a { box-shadow: none; text-decoration: underline; text-underline-offset: 3px; }
/* ---------- image lightbox (assets/js/lightbox.js) ---------- */
.post-content img.lb-zoomable { cursor: zoom-in; }
.post-content img.lb-zoomable:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
html.lb-open, html.lb-open body { overflow: hidden; }
.lb {
  position: fixed; inset: 0; z-index: 1000; display: none;
  background: rgba(1, 4, 9, var(--lb-fade, 0.97));
  color: #e6edf3; -webkit-tap-highlight-color: transparent;
}
.lb.lb-show { display: block; animation: lb-in 0.18s ease-out; }
@keyframes lb-in { from { opacity: 0; } }
.lb-stage {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 56px 16px 72px; overflow: hidden; touch-action: none; cursor: zoom-out;
}
.lb-img {
  max-width: 100%; max-height: 100%; width: auto; height: auto; margin: 0;
  border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  user-select: none; -webkit-user-drag: none; cursor: zoom-in;
  transform-origin: center center;
}
.lb-img.lb-svg { background: #fff; }
.lb-img.lb-anim { transition: transform 0.22s ease; }
.lb-show .lb-img { animation: lb-pop 0.22s ease-out; }
@keyframes lb-pop { from { opacity: 0; scale: 0.94; } }
.lb.lb-zoomed .lb-img { cursor: grab; }
.lb.lb-zoomed .lb-img:active { cursor: grabbing; }
.lb.lb-zoomed .lb-caption, .lb.lb-zoomed .lb-nav { opacity: 0; pointer-events: none; }
.lb-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 56px; padding: 0 8px 0 18px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
  font-family: var(--mono); font-size: 13px; color: #8b949e;
}
.lb-btn {
  pointer-events: auto; display: grid; place-items: center; width: 44px; height: 44px;
  border: 0; border-radius: 50%; background: rgba(110, 118, 129, 0.25); color: #e6edf3;
  font-size: 28px; line-height: 1; cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease;
}
.lb-btn:hover, .lb-btn:focus-visible { background: rgba(63, 185, 80, 0.35); outline: none; }
.lb-nav { position: absolute; top: 50%; margin-top: -22px; font-size: 34px; padding-bottom: 4px; }
.lb-prev { left: 12px; }
.lb-next { right: 12px; }
.lb-caption {
  position: absolute; left: 0; right: 0; bottom: 14px; margin: 0 auto; max-width: 820px;
  padding: 0 20px; font-size: 14px; line-height: 1.5; text-align: center; color: #c9d1d9;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  transition: opacity 0.15s ease; pointer-events: none;
}
@media (max-width: 640px) {
  .lb-stage { padding: 52px 0 84px; }
  .lb-img { border-radius: 0; }
  .lb-nav { display: none; }
  .lb-caption { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .lb.lb-show, .lb-show .lb-img { animation: none; }
  .lb-img.lb-anim { transition: none; }
}
</style>
