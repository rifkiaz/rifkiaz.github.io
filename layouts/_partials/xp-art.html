{{- /* Ilustrasi kecil per pekerjaan untuk shortcode pengalaman. Konteks: nama ilustrasi (field `art` di data/pengalaman.yaml). */ -}}
{{- $a := . -}}
<svg class="xp-art xp-art--{{ $a }}" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <rect class="xp-art__bg" x="1" y="1" width="62" height="62" rx="12"/>
{{- if eq $a "cloud" }}
  {{- /* migrasi multi-cloud: dua awan, paket data berpindah */}}
  <path class="xp-s xp-s--b" d="M10 27a6 6 0 0 1 2-11.6A7.5 7.5 0 0 1 26 17a5 5 0 0 1 1 10z"/>
  <path class="xp-s xp-s--g" d="M37 49a6 6 0 0 1 2-11.6A7.5 7.5 0 0 1 53 39a5 5 0 0 1 1 10z"/>
  <path class="xp-s xp-s--m" d="M20 31v6a6 6 0 0 0 6 6h7" stroke-dasharray="2 3"/>
  <path class="xp-s xp-s--m" d="M30 40l3 3-3 3"/>
  <rect class="xp-f xp-f--a xp-move" x="18" y="29" width="5" height="5" rx="1"/>
{{- else if eq $a "k8s" }}
  {{- /* kemudi Kubernetes yang berputar pelan */}}
  <g class="xp-spin">
    <circle class="xp-s xp-s--g" cx="32" cy="32" r="14"/>
    <circle class="xp-s xp-s--g" cx="32" cy="32" r="4"/>
    <path class="xp-s xp-s--g" d="M32 18v-7M32 46v7M18 32h-7M46 32h7M22 22l-5-5M42 42l5 5M42 22l5-5M22 42l-5 5"/>
    <path class="xp-s xp-s--b" d="M32 28v-10M32 36v10M28 32H18M36 32h10"/>
  </g>
{{- else if eq $a "ship" }}
  {{- /* kapal di atas ombak */}}
  <g class="xp-bob">
    <path class="xp-s xp-s--g" d="M14 38h36l-5 8H19z"/>
    <path class="xp-s xp-s--b" d="M22 38v-7h14v7M28 31v-7h5v7"/>
    <path class="xp-s xp-s--a" d="M40 24h4"/>
  </g>
  <path class="xp-s xp-s--b xp-wave" d="M-4 52q4-4 8 0t8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0"/>
{{- else if eq $a "containers" }}
  {{- /* tumpukan container */}}
  <rect class="xp-s xp-s--g" x="10" y="38" width="20" height="13" rx="2"/>
  <rect class="xp-s xp-s--b" x="34" y="38" width="20" height="13" rx="2"/>
  <path class="xp-s xp-s--m" d="M16 41v7M20 41v7M24 41v7M40 41v7M44 41v7M48 41v7"/>
  <g class="xp-drop">
    <rect class="xp-s xp-s--a" x="22" y="16" width="20" height="13" rx="2"/>
    <path class="xp-s xp-s--m" d="M28 19v7M32 19v7M36 19v7"/>
  </g>
{{- else if eq $a "rack" }}
  {{- /* rak server dengan lampu berkedip */}}
  <rect class="xp-s xp-s--m" x="16" y="10" width="32" height="44" rx="3"/>
  <rect class="xp-s xp-s--g" x="20" y="15" width="24" height="9" rx="1.5"/>
  <rect class="xp-s xp-s--g" x="20" y="28" width="24" height="9" rx="1.5"/>
  <rect class="xp-s xp-s--g" x="20" y="41" width="24" height="9" rx="1.5"/>
  <circle class="xp-f xp-f--g xp-led" cx="25" cy="19.5" r="1.6"/>
  <circle class="xp-f xp-f--a xp-led xp-led--2" cx="25" cy="32.5" r="1.6"/>
  <circle class="xp-f xp-f--g xp-led xp-led--3" cx="25" cy="45.5" r="1.6"/>
  <path class="xp-s xp-s--m" d="M31 19.5h9M31 32.5h9M31 45.5h9"/>
{{- else }}
  {{- /* terminal pertama: prompt dan kursor */}}
  <rect class="xp-s xp-s--m" x="9" y="14" width="46" height="36" rx="4"/>
  <path class="xp-s xp-s--m" d="M9 22h46"/>
  <path class="xp-s xp-s--g" d="M16 30l5 4-5 4"/>
  <rect class="xp-f xp-f--g xp-cursor" x="25" y="36" width="8" height="3" rx="1"/>
{{- end }}
</svg>
