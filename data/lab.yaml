# Lab hub (/lab/) and the "Lab" dropdown in the top menu are both built from
# this file. An entry only shows once a page with that url exists, so labs
# that are still being built can be listed ahead of time.
groups:
  - id: simulasi
    name: Simulasi
    desc: Coba tool DevOps langsung di browser, tanpa server dan tanpa akun cloud.
    items:
      - { url: /git/, name: Git, icon: git, desc: "Init, add, commit, branch, merge sampai konflik, push dan pull bareng teman, lalu stash, reset, reflog, dan rebase." }
      - { url: /docker/, name: Docker, icon: docker, desc: "Build image, jalankan container, dan atur network serta volume." }
      - { url: /swarm/, name: Docker Swarm, icon: swarm, desc: "Bikin cluster Swarm, deploy service, scale, dan lihat failover." }
      - { url: /ceph/, name: Ceph, icon: ceph, desc: "Simulasi cluster storage Ceph: OSD, pool, replikasi, dan recovery." }
      - { url: /openstack/, name: OpenStack, icon: openstack, desc: "Private cloud mini: network, router, security group, server, floating IP, dan volume." }
      - { url: /vault/, name: Vault, icon: vault, desc: "Init dan unseal, simpan secret, tulis policy, AppRole, kredensial database dinamis, dan transit." }
      - { url: /terraform/, name: Terraform, icon: terraform, desc: "Tulis main.tf, lalu init, plan, apply, dan destroy ke akun AWS bohongan." }
      - { url: /ansible/, name: Ansible, icon: ansible, desc: "Jalankan playbook ke lima server lab dan lihat hasil per host." }
      - { url: /gitops/, name: GitOps, icon: gitops, desc: "Commit manifest, lalu lihat Argo CD sync, self-heal, dan rollback." }
  - id: tools
    name: Tools
    desc: Alat bantu kecil buat kerjaan sehari-hari.
    items:
      - { url: /topologi/, name: Topologi, icon: topologi, desc: "Susun diagram infra AWS, GCP, dan Kubernetes, lalu ekspor gambarnya." }
      - { url: /kalkulator/, name: Kalkulator Cloud, icon: kalkulator, desc: "Bandingkan estimasi biaya bulanan AWS dan GCP berdampingan." }
  - id: party
    name: Game Party
    desc: Game rame-rame pakai satu HP yang dioper keliling. Daftar pemain dan progres disimpan di browser kamu, jadi aman kalau halaman ke-refresh.
    items:
      - { url: /werewolf/, name: Werewolf, icon: werewolf, desc: "Siapa serigalanya? Malam memangsa, siang voting. Bisa pakai moderator atau HP dioper." }
      - { url: /mata-mata/, name: Mata-mata, icon: mata-mata, desc: "Semua tahu tempatnya kecuali mata-mata. Tanya jawab, lalu tangkap dia." }
      - { url: /kata-rahasia/, name: Kata Rahasia, icon: kata-rahasia, desc: "Kata kamu sama dengan yang lain, atau justru kamu penyusupnya?" }
  - id: fun
    name: Fun
    desc: Buat iseng.
    items:
      - { url: /terminal/, name: Terminal, icon: terminal, desc: "Terminal mini: jelajahi tulisan pakai ls dan cat, atau main game." }
